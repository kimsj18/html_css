<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8">
    <title>회원 가입</title>
    <style>
      #container {
        width:600px;
        margin:10px auto;
      }

      textarea{
        vertical-align: top;
      }
    </style>
  </head>
  <body> 
    <div id="container">
      <h1>회원 가입을 환영합니다</h1>
      <form action="../input/myform.html" method="get">
        <fieldset>
            <legend>사용자 정보</legend>
            <ul>
                <li>
                    <label for="user_id">아이디<input type="text" id = "user_id" autofocus placeholder="4자~10자 사이, 공백없이" required></label>
                 
                </li>
                <li>
                    <label for="email">이메일</label>
                    <input type="email" name="" id="email" required>
                </li>
                <li>
                    <label for="password">비밀번호</label>
                    <input type="password" name="" id="password" placeholder="문자와 숫자, 특수문자 포함 15글자 이내" required>
                </li>
                <li>
                    <label for="password1">비밀번호 확인</label>
                    <input type="password" name="" id="passwprd1" required>
                </li>
                <li>
                    <label for="가입경로">가입경로
                    <select name="path" id="path">
                        <option value="블로그">블로그</option>
                        <option value="검색">검색</option>
                        <option value="SNS">SNS</option>
                    </select></label>
                </li>
                <li>
                    <label for="mimo">메모
                    <textarea name="memo" id="memo" rows="5" cols="40"></textarea>
                </label>
                </li>
                <li>
                    <label for="profile">사진</label>
                    <input type="file" name="profile" id="profile">
                </li>
                <li>
                    <label for="birth">생년월일</label>
                 
                </li>
            </ul>
        </fieldset>
        <fieldset>
            <legend>이벤트와 새로운 소식</legend>
            <label for=""><input type="radio" name="email" id="y" checked>메일 수신</label>
            <label for=""><input type="radio" name="email" id="n">메일 수신 안 함</label>
        </fieldset>
        <input type="submit" value="가입하기">
        <input type="reset" value="취소">
      </form>

    </div>           
  </body>
</html>
